name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Generate / Build / Vet / Test / Race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 与 docs/gitops/README.md「验收门禁」一致：
      # go generate 后 git diff --exit-code 强制生成文件与提交版一致（golden 门禁）。
      - name: Generate
        run: go generate ./...

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: Generated files unchanged
        run: git diff --exit-code

      - name: Whitespace check
        run: git diff --check

  # main 保持线性：禁止 merge commit（docs/gitops/README.md §1）。
  linear-main:
    name: Main is linear
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Assert no merge commits on main
        run: |
          count=$(git rev-list --merges --count origin/main)
          echo "merge commits on origin/main: ${count}"
          if [ "${count}" != "0" ]; then
            echo "::error::main 存在 merge commit，违反线性规范，请改用 gh pr merge --rebase"
            exit 1
          fi

  # 分支命名规范：<type>/<NNN>-<kebab-slug>（docs/gitops/README.md §1）。
  branch-name:
    name: Branch name follows convention
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! [[ "${HEAD_REF}" =~ ^(feat|fix|refactor|docs|test|chore)/[0-9]+(-[a-z0-9]+)+$ ]]; then
            echo "::error::分支名 '${HEAD_REF}' 不符合规范 <type>/<NNN>-<kebab-slug>（type ∈ feat/fix/refactor/docs/test/chore，NNN 为 issue 编号）"
            exit 1
          fi
          echo "分支名符合规范: ${HEAD_REF}"
